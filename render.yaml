services:
  - type: web
    name: placementprep-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: placementprep-db
          property: connectionString

databases:
  - name: placementprep-db
    plan: basic-256mb
    region: oregon
